name: Release

on:
  push:
    tags:
      - 'v*' # This triggers the workflow on any tag starting with 'v'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # You could add other configurations like 'debug' and 'release' here
        # config: [Release, Debug]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true # Clones submodules recursively
          
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          # Install development packages for ZLIB and OpenSSL
          sudo apt-get install -y zlib1g-dev libssl-dev
          
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          
      - name: Build project
        run: |
          cmake --build build --config Release
          
      - name: Create archive
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            cd build
            7z a ModLoader-${{ runner.os }}.zip Release/*
          else
            cd build
            zip -r ModLoader-${{ runner.os }}.zip Release/*
          fi
        shell: bash
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModLoader-${{ runner.os }}
          path: build/ModLoader-${{ runner.os }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Find and upload release assets
        run: |
          for file in artifacts/*/ModLoader-*.zip; do
            filename=$(basename "$file")
            curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary "@$file" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}/assets?name=$filename"
          done
        shell: bash